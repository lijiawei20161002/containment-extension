[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "containment-extension"
version = "0.1.0"
description = "Local incident-analogue experiments for Safe Frontier Evaluations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Jiawei Li"}]
dependencies = []

[project.optional-dependencies]
inspect = ["inspect-ai>=0.3.200"]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
safe-frontier = "containment_extension.cli:main"

[tool.setuptools.packages.find]
include = ["containment_extension*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
